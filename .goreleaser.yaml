version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: minepulse
    main: .
    binary: minepulse
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

sboms:
  - artifacts: archive

# Multi-arch, distroless image built straight from Go (no Dockerfile), SBOM'd.
kos:
  - id: minepulse
    build: minepulse
    base_image: gcr.io/distroless/static:nonroot
    repository: ghcr.io/docked-titan-foundation/minepulse
    platforms: [linux/amd64, linux/arm64]
    tags:
      - "{{ .Version }}"
      - latest
    bare: true
    sbom: spdx

# Keyless cosign signatures (needs OIDC id-token in CI).
signs:
  # cosign 3.x emits one Sigstore bundle — signature, certificate and
  # transparency-log entry together — instead of separate .sig/.pem files, and
  # refuses to sign at all without --bundle ("must specify --bundle with
  # --new-bundle-format"). The old --output-signature/--output-certificate flags
  # are deprecated and ignored.
  #
  # GoReleaser has no "bundle" field, so the bundle is declared as this signing
  # step's `signature` artifact: that is simply the path GoReleaser tracks and
  # uploads, and the name it carries is the one below. There is no separate
  # certificate artifact any more because the bundle already contains it.
  #
  # Verify a release with:
  #   cosign verify-blob \
  #     --bundle minepulse_<version>_checksums.txt.bundle \
  #     --certificate-identity-regexp 'https://github.com/docked-titan-foundation/minepulse/.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     minepulse_<version>_checksums.txt
  - cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    signature: "${artifact}.bundle"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    args: ["sign", "--yes", "${artifact}"]
    artifacts: all
    output: true

# semantic-release owns versioning, the changelog, and creating the GitHub
# Release; goreleaser only appends the built artifacts to it.
changelog:
  disable: true

release:
  mode: append
