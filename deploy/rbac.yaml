# Least-privilege, read-only RBAC for minepulse (Constitution II: observe, never
# mutate). Grants exactly the reads the collectors perform and nothing else.
#
# minepulse normally runs locally with your kubeconfig — in that case these verbs
# must be available to *your* user (they usually are for a cluster admin). Apply
# this when you want a dedicated, minimal ServiceAccount instead (e.g. for the
# future in-cluster deployment). Adjust the namespace to where the miner runs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minepulse
  namespace: monero-idle-miner
---
# Namespaced reads: miner pods, their logs, and the pod HTTP API via proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minepulse-reader
  namespace: monero-idle-miner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/proxy"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Cluster-scoped reads: node capacity and node CPU metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minepulse-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minepulse-reader
  namespace: monero-idle-miner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minepulse-reader
subjects:
  - kind: ServiceAccount
    name: minepulse
    namespace: monero-idle-miner
---
# Cluster-scoped pod reads: the Bitcoin tab finds the solo pool (public-pool or
# ckpool) wherever it is installed, which means listing pods outside the miner's
# namespace and reading that one pod's logs and HTTP API through the proxy.
# Still read verbs only.
#
# Skip this binding if you would rather scope the search: `--btc-namespace <ns>`
# with a Role like minepulse-reader in that namespace does the same job, and
# `--no-btc` turns the search off entirely. Without either, minepulse narrows the
# search to the miner's namespace and says so rather than failing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minepulse-pool-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minepulse-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minepulse-node-reader
subjects:
  - kind: ServiceAccount
    name: minepulse
    namespace: monero-idle-miner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minepulse-pool-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minepulse-pool-reader
subjects:
  - kind: ServiceAccount
    name: minepulse
    namespace: monero-idle-miner
