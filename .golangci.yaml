run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/docked-titan-foundation/minepulse
  misspell:
    locale: US

issues:
  exclude-rules:
    # Fixture-driven tests and the mock may keep illustrative unused fields.
    - path: _test\.go
      linters: [errcheck]
