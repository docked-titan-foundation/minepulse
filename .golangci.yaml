version: "2"
run:
  timeout: 5m
linters:
  enable:
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      locale: US
      # ckpool's own JSON key is "authorised" (its author writes British English).
      # The struct tag has to match the wire format byte for byte, so this word is
      # data, not prose. Go identifiers around it still use US spelling.
      ignore-rules:
        - authorised
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/docked-titan-foundation/minepulse
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
