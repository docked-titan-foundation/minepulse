---
name: Release

# Builds the multi-arch binary + distroless image, generates SBOMs, cosign-signs
# them, and appends the artifacts to the GitHub Release semantic-release created.
#
# Runs either when a version tag is pushed, or on manual/dispatched request (the
# pipeline dispatches this after a successful release, since a tag pushed by the
# release bot does not reliably trigger a tag-`push` workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: latest stable)"
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Resolve tag to build
        id: t
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          [ -z "$TAG" ] && TAG=$(git tag --sort=-v:refname | grep -v -- '-' | head -1)
          if [ -z "$TAG" ]; then echo "::error::no tag to build"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: git checkout "${{ steps.t.outputs.tag }}"
      - uses: actions/setup-go@v7
        with: { go-version: "1.23" }
      - uses: ko-build/setup-ko@v0.10
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/docked-titan-foundation/minepulse
