---
name: CI_CD

# On a push to a release branch: gate on quality, then let semantic-release cut
# the version (tag + changelog + GitHub Release). Pushing the tag with an App
# token triggers release.yml, which builds, signs, and publishes the artifacts.
on:
  push:
    branches: [main, beta]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: "1.23" }
      - run: |
          go vet ./...
          go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: v1.61.0 }
      - run: go build -trimpath -o /dev/null .

  release:
    needs: quality
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      !contains(github.actor, 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.TITAN_RELEASER_ID }}
          private-key: ${{ secrets.TITAN_RELEASER_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@v6
        with: { node-version: "24" }

      # Sign the version commit-back with the release bot's GPG key so it shows
      # "Verified" on GitHub, authored as s-release[bot] (mirrors ckpool /
      # bitcoin-stack).
      - name: Import the release bot's GPG key
        env:
          TITAN_RELEASER_BASE64_GPG_KEY: ${{ secrets.TITAN_RELEASER_BASE64_GPG_KEY }}
        run: echo -n "$TITAN_RELEASER_BASE64_GPG_KEY" | base64 --decode | gpg --batch --import

      - name: Configure signed commits
        env:
          TITAN_RELEASER_GPG_KEY_ID: ${{ secrets.TITAN_RELEASER_GPG_KEY_ID }}
        run: |
          cat > /tmp/gpg.sh <<'EOF'
          #!/bin/bash
          gpg --batch --pinentry-mode loopback \
              --passphrase "$TITAN_RELEASER_GPG_PASSPHRASE" "$@"
          EOF
          chmod +x /tmp/gpg.sh
          git config commit.gpgsign true
          git config user.signingkey "$TITAN_RELEASER_GPG_KEY_ID"
          git config gpg.program /tmp/gpg.sh

      - run: npm install
      - name: semantic-release
        id: sr
        env:
          TITAN_RELEASER_GPG_PASSPHRASE: ${{ secrets.TITAN_RELEASER_GPG_PASSPHRASE }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: s-release[bot]
          GIT_AUTHOR_EMAIL: ${{ secrets.TITAN_RELEASER_EMAIL }}
          GIT_COMMITTER_NAME: s-release[bot]
          GIT_COMMITTER_EMAIL: ${{ secrets.TITAN_RELEASER_EMAIL }}
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee /tmp/sr.log
          VER=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' /tmp/sr.log | head -1 || true)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      # Build, sign, and publish the artifacts inline when a release was actually
      # published. semantic-release has just created and pushed the tag, so
      # goreleaser derives the version from it. (Done here rather than via a
      # cross-workflow dispatch, which the app token can't trigger.)
      - name: Set up Go
        if: steps.sr.outputs.version != ''
        uses: actions/setup-go@v6
        with: { go-version: "1.23" }
      - if: steps.sr.outputs.version != ''
        uses: ko-build/setup-ko@v0.9
      - if: steps.sr.outputs.version != ''
        uses: sigstore/cosign-installer@v3
      - if: steps.sr.outputs.version != ''
        uses: anchore/sbom-action/download-syft@v0
      - name: Log in to ghcr
        if: steps.sr.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser
        if: steps.sr.outputs.version != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/docked-titan-foundation/minepulse
