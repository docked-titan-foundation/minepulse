---
name: CI_CD

# On a push to a release branch: gate on quality, then let semantic-release cut
# the version (tag + changelog + GitHub Release). Pushing the tag with an App
# token triggers release.yml, which builds, signs, and publishes the artifacts.
on:
  push:
    branches: [main, beta]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: "1.23" }
      - run: |
          go vet ./...
          go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with: { version: v1.61.0 }
      - run: go build -trimpath -o /dev/null .

  release:
    needs: quality
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') &&
      !contains(github.actor, 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.TITAN_RELEASER_ID }}
          private-key: ${{ secrets.TITAN_RELEASER_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - run: npm install
      - name: semantic-release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: npx semantic-release
